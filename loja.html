<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | Videira</title>
<style>
html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}.snapshot-loading{min-height:100vh;display:grid;place-items:center;color:#555}.snapshot-loading b{font-size:20px}
</style></head><body><div class="snapshot-loading"><b>Carregando Videira...</b></div>
<script>
(async()=>{
 const parts=["/snapshot/vshop-01.part","/snapshot/vshop-02.part","/snapshot/vshop-03.part","/snapshot/vshop-04.part"];
 const html=(await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()})))).join("");
 document.body.innerHTML=html;
 const style=document.createElement("style");
 style.textContent=`
 a[aria-label="vivino.com"] svg{display:none!important}
 a[aria-label="vivino.com"]{min-width:145px!important;display:flex!important;align-items:center!important;text-decoration:none!important}
 a[aria-label="vivino.com"]::after{content:"VIDEIRA";font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:800;letter-spacing:2px;color:#ba1628}
 `;
 document.head.appendChild(style);
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{
   if(!n.parentElement||["SCRIPT","STYLE"].includes(n.parentElement.tagName))return;
   let v=n.nodeValue;
   if(v.includes("Best offers for you"))v=v.replace("Best offers for you","Descobertas da semana");
   if(v.includes("Mais vendidos em Brasil"))v=v.replace("Mais vendidos em Brasil","Mais procurados no Brasil");
   if(v.trim()==="Adicionar")v="Pedir orçamento";
   if(v.includes("Vivino"))v=v.replaceAll("Vivino","Videira");
   n.nodeValue=v;
 });
 document.querySelectorAll("a").forEach(a=>{
   const h=a.getAttribute("href")||"";
   if(h==="index.html"||/vivino\.com\/(BR\/pt-BR\/)?$/.test(h))a.href="/";
   else if(h.includes("/explore"))a.href="/loja.html";
   else if(h.includes("vivino.com")&&h.includes("/w/"))a.href="/vinho.html";
 });
 document.querySelectorAll("form").forEach(f=>{
   const q=f.querySelector('input[name="q"]');
   if(q)f.addEventListener("submit",e=>{e.preventDefault();location.href="/loja.html?q="+encodeURIComponent(q.value||"")});
 });
 document.querySelectorAll("button").forEach(b=>{
   if((b.textContent||"").trim()==="Pedir orçamento")b.addEventListener("click",e=>{
     e.preventDefault();window.open("https://wa.me/?text="+encodeURIComponent("Olá! Gostaria de pedir um orçamento de vinho na Videira."),"_blank","noopener");
   });
 });
})().catch(err=>{document.body.innerHTML='<div class="snapshot-loading"><b>Erro ao carregar a página.</b></div>';console.error(err)});
</script></body></html>
